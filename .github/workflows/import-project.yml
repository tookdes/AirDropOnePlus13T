name: Import audited source project
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-project.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Decode checksum-locked source files only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path, PurePosixPath
          root=Path.cwd()
          m=json.loads(Path('imports/manifest.json').read_text())
          raw=b''.join(base64.b64decode(Path(f'imports/part-{i}.b64').read_bytes(),validate=True) for i in range(m['parts']))
          assert len(raw)==39572 and hashlib.sha256(raw).hexdigest()=='26f06ca327cbff3d5eddf030d8d31a2296bd3cc203b915d978784a31e139fad0'
          dec=lzma.LZMADecompressor(memlimit=512*1024*1024)
          text=dec.decompress(raw,max_length=163805)
          assert dec.eof and not dec.unused_data and len(text)==163804
          assert hashlib.sha256(text).hexdigest()=='510ef410335fcdfe4ddcb2e545db3d202d6eb862206b89c93b3879ee1c8ca39f'
          files=json.loads(text)
          assert len(files)==26 and set(files)==set(m['files'])
          for name,content in files.items():
            p=PurePosixPath(name)
            assert not p.is_absolute() and '..' not in p.parts and isinstance(content,str)
            assert p.parts[0] in ('tools','tests','shim','evidence','THIRD_PARTY_NOTICES.md')
            assert p.parts[0]!='evidence' or name=='evidence/stock_icnss2_versions.json'
            dst=root/name
            assert dst.resolve().is_relative_to(root)
            assert not dst.is_symlink()
            dst.parent.mkdir(parents=True,exist_ok=True)
            dst.write_text(content)
          PY
      - name: Retrieve byte-verified public source fixtures and regenerate patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, sys, urllib.request
          from pathlib import Path
          sys.path.insert(0,'tools')
          from build_seed_series import FILES, CANONICAL
          from extend_series import REL, BLOB
          refs=[('op15','sm8850','5ab2a689ff87d7d28c511f1762cf41c1b90d965a',FILES),('op13t','sm8750','6a196f79f77acd55cf302e1696c038e4cad99254',{CANONICAL:'9b03aa77703413e87dece1bc1d39369088808f88',REL:BLOB})]
          for label,chip,commit,files in refs:
            for path,want in files.items():
              url=f'https://raw.githubusercontent.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_{chip}/{commit}/{path}'
              with urllib.request.urlopen(url,timeout=60) as r: data=r.read(1024*1024)
              got=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert got==want,(path,got,want)
              dest=Path('upstream')/(label+'-excerpts')/path
              dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
          PY
          python3 tools/extend_series.py
          python3 -m unittest discover -s tests -v
      - name: Commit readable sources, tests, and reproducible patches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools tests shim THIRD_PARTY_NOTICES.md evidence/stock_icnss2_versions.json upstream/op13t-excerpts upstream/op15-excerpts patches
          test -z "$(git diff --cached --name-only | grep -E '(^evidence/stock/|\.(img|bin|btf|ko)$)' || true)"
          git rm imports/part-*.b64
          git commit -m 'Import reviewed utilities, 77-test suite, source fixtures, and four reproducible seed patches'
          git push origin HEAD:main
