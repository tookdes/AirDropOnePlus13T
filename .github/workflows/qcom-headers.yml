name: Fetch locked Qualcomm kernel integration sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/qcom-headers.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch matching official Qualcomm tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qcom-output"
          cd "$RUNNER_TEMP"
          git init -q qcom
          git -C qcom remote add origin https://github.com/OnePlusOSS/android_kernel_oneplus_sm8750.git
          git -C qcom sparse-checkout init --cone
          git -C qcom sparse-checkout set include net/wireless net/mac80211 net/rfkill kernel/sched/walt lib/crypto scripts
          git -C qcom fetch --filter=blob:none --depth=1 origin 745702d5ed2c0435f2b1d3bb78bc4f48422d4191
          git -C qcom checkout --detach FETCH_HEAD
          test "$(git -C qcom rev-parse HEAD)" = 745702d5ed2c0435f2b1d3bb78bc4f48422d4191
          git -C qcom log -1 --format=fuller > qcom-output/revision.txt
          tar -czf qcom-output/qcom-integration.tar.gz qcom
          cd qcom-output
          sha256sum qcom-integration.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: op13t-qcom-integration-source
          path: ${{ runner.temp }}/qcom-output/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
