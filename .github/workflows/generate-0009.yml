name: Generate reviewed 0009 MAC-SME patch
on:
  push:
    branches: [main]
    paths:
      - 'tools/generate_0009_mac_sme.py'
      - '.github/workflows/generate-0009.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: op13t-generate-0009
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch exact public target and donor introduction commits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/target" "$RUNNER_TEMP/donor"
          git -C "$RUNNER_TEMP/target" init -q
          git -C "$RUNNER_TEMP/target" remote add origin https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8750.git
          git -C "$RUNNER_TEMP/target" fetch --depth=1 origin 6a196f79f77acd55cf302e1696c038e4cad99254
          git -C "$RUNNER_TEMP/target" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/donor" init -q
          git -C "$RUNNER_TEMP/donor" remote add origin https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8850.git
          git -C "$RUNNER_TEMP/donor" fetch --depth=1 origin 307d23721d20e21b8160b9ba9c3cb50911ff8c00
          git -C "$RUNNER_TEMP/donor" fetch --depth=1 origin 7fb7abf097a18c6e2ad2fb9d18876b095898e87f
      - name: Generate and validate exact static patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_0009_mac_sme.py \
            --target "$RUNNER_TEMP/target" \
            --donor "$RUNNER_TEMP/donor" \
            --out patches/0009-mac-sme-passthru-session-control.patch
          test "$(sha256sum patches/0009-mac-sme-passthru-session-control.patch | awk '{print $1}')" = b7e69e63f3375fb4ad02f958fd4926a441c652a6bedd547fe50095b5e3c6af25
          git apply --check --stat patches/0009-mac-sme-passthru-session-control.patch
      - name: Commit generated patch if absent or changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- patches/0009-mac-sme-passthru-session-control.patch && \
             git ls-files --error-unmatch patches/0009-mac-sme-passthru-session-control.patch >/dev/null 2>&1; then
            echo "0009 already matches reviewed deterministic output"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/0009-mac-sme-passthru-session-control.patch
          git commit -m "backport: add MAC/SME passthru session control with monitor compatibility"
          git push origin HEAD:main
