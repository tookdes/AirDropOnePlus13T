name: Record exact WonderTap introduction diff
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vendor-diff.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch donor introduction and its parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/donor-diff" "$RUNNER_TEMP/diff-results"
          cd "$RUNNER_TEMP/donor-diff"
          git init -q
          git remote add origin https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8850.git
          git fetch --depth=1 origin 307d23721d20e21b8160b9ba9c3cb50911ff8c00
          git fetch --depth=1 origin 7fb7abf097a18c6e2ad2fb9d18876b095898e87f
          git diff --binary 7fb7abf097a18c6e2ad2fb9d18876b095898e87f 307d23721d20e21b8160b9ba9c3cb50911ff8c00 -- vendor/qcom/opensource/wlan vendor/oplus/kernel/wifi > "$RUNNER_TEMP/diff-results/wlan-introduction.patch"
          git diff --numstat 7fb7abf097a18c6e2ad2fb9d18876b095898e87f 307d23721d20e21b8160b9ba9c3cb50911ff8c00 -- vendor/qcom/opensource/wlan vendor/oplus/kernel/wifi > "$RUNNER_TEMP/diff-results/numstat.txt"
          git log -1 --format=fuller 307d23721d20e21b8160b9ba9c3cb50911ff8c00 > "$RUNNER_TEMP/diff-results/introduction.txt"
          cd "$RUNNER_TEMP/diff-results"
          sha256sum wlan-introduction.patch numstat.txt introduction.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: op13t-wlan-introduction-source-diff
          path: ${{ runner.temp }}/diff-results/
          retention-days: 14
          if-no-files-found: error
