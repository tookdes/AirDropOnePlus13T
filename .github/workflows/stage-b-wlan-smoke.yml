name: Compile qcacld baseline vs Wonder candidate (ARM64, diagnostic)
on:
  push:
    branches: [main]
    paths:
      - 'tools/build_wlan_compile_smoke.py'
      - 'tools/candidate_donor_slice.py'
      - 'tools/build_public_stage_a.py'
      - 'patches/**'
      - '.github/workflows/stage-b-wlan-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: op13t-wlan-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev pahole gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Fetch exact public 13T, donor commits, common kernel and r510928
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/op13t-inputs"
          mkdir -p "$root"
          git -C "$root" init -q common
          git -C "$root/common" remote add origin https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8750.git
          git -C "$root/common" fetch --depth=1 origin 5a0ffb447c1dbd82e8e3af7a98c4a629f4b6d143
          git -C "$root/common" checkout --detach FETCH_HEAD

          git -C "$root" init -q target
          git -C "$root/target" remote add origin https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8750.git
          git -C "$root/target" fetch --depth=1 origin 6a196f79f77acd55cf302e1696c038e4cad99254
          git -C "$root/target" checkout --detach FETCH_HEAD

          git -C "$root" init -q donor
          git -C "$root/donor" remote add origin https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8850.git
          git -C "$root/donor" fetch --depth=1 origin 307d23721d20e21b8160b9ba9c3cb50911ff8c00
          git -C "$root/donor" fetch --depth=1 origin 7fb7abf097a18c6e2ad2fb9d18876b095898e87f

          git -C "$root" init -q toolchain
          git -C "$root/toolchain" remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git -C "$root/toolchain" sparse-checkout init --cone
          git -C "$root/toolchain" sparse-checkout set clang-r510928
          git -C "$root/toolchain" -c http.version=HTTP/1.1 fetch --filter=blob:none --depth=1 origin 18bfb7fbd697a1ad710fd0581a4ac9f3db385f71
          git -C "$root/toolchain" checkout --detach FETCH_HEAD
      - name: Prepare exact stock-compatible GKI module environment
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_public_stage_a.py \
            --kernel-source "$RUNNER_TEMP/op13t-inputs/common" \
            --clang-dir "$RUNNER_TEMP/op13t-inputs/toolchain/clang-r510928/bin" \
            --out "$RUNNER_TEMP/stage-a"
      - name: Reproduce compile-only donor candidate tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/candidate_donor_slice.py \
            --target "$RUNNER_TEMP/op13t-inputs/target" \
            --donor "$RUNNER_TEMP/op13t-inputs/donor" \
            --output "$RUNNER_TEMP/candidate"
      - name: Compile baseline and passthru candidate with identical ARM64 Kbuild
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_wlan_compile_smoke.py \
            --kernel "$RUNNER_TEMP/op13t-inputs/common" \
            --kernel-out "$RUNNER_TEMP/stage-a/kernel-out" \
            --compiler "$RUNNER_TEMP/op13t-inputs/toolchain/clang-r510928/bin" \
            --baseline "$RUNNER_TEMP/op13t-inputs/target" \
            --candidate "$RUNNER_TEMP/candidate" \
            --out "$RUNNER_TEMP/wlan-smoke"
      - name: Preserve reports, compile logs and diagnostic .ko even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: op13t-wlan-compile-smoke
          path: |
            ${{ runner.temp }}/wlan-smoke/report.json
            ${{ runner.temp }}/wlan-smoke/baseline/build.log
            ${{ runner.temp }}/wlan-smoke/candidate/build.log
            ${{ runner.temp }}/candidate/backport-candidate.json
            ${{ runner.temp }}/wlan-smoke/baseline/src/qca_cld3_peach_v2.ko
            ${{ runner.temp }}/wlan-smoke/candidate/src/qca_cld3_peach_v2.ko
          retention-days: 14
          if-no-files-found: warn
