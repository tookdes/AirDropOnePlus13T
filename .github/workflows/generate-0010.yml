name: Generate reviewed 0010 channel-WMA-MLME patch
on:
  push:
    branches: [main]
    paths:
      - 'tools/generate_0010_channel_wma_mlme.py'
      - '.github/workflows/generate-0010.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: op13t-generate-0010
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch exact public target and donor introduction commits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/target" "$RUNNER_TEMP/donor"
          git -C "$RUNNER_TEMP/target" init -q
          git -C "$RUNNER_TEMP/target" remote add origin https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8750.git
          git -C "$RUNNER_TEMP/target" fetch --depth=1 origin 6a196f79f77acd55cf302e1696c038e4cad99254
          git -C "$RUNNER_TEMP/target" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/donor" init -q
          git -C "$RUNNER_TEMP/donor" remote add origin https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8850.git
          git -C "$RUNNER_TEMP/donor" fetch --depth=1 origin 307d23721d20e21b8160b9ba9c3cb50911ff8c00
          git -C "$RUNNER_TEMP/donor" fetch --depth=1 origin 7fb7abf097a18c6e2ad2fb9d18876b095898e87f
      - name: Generate exact four-file control patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_0010_channel_wma_mlme.py \
            --target "$RUNNER_TEMP/target" \
            --donor "$RUNNER_TEMP/donor" \
            --out patches/0010-channel-wma-mlme-passthru.patch
          test "$(sha256sum patches/0010-channel-wma-mlme-passthru.patch | awk '{print $1}')" = bd145ca474181e93ca5416a6525ef4281640859e5a841ec8f39b420a2483a064
          git -C "$RUNNER_TEMP/target" apply --check "$GITHUB_WORKSPACE/patches/0010-channel-wma-mlme-passthru.patch"
          git apply --stat patches/0010-channel-wma-mlme-passthru.patch
      - name: Commit generated patch if absent or changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- patches/0010-channel-wma-mlme-passthru.patch && \
             git ls-files --error-unmatch patches/0010-channel-wma-mlme-passthru.patch >/dev/null 2>&1; then
            echo "0010 already matches reviewed deterministic output"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/0010-channel-wma-mlme-passthru.patch
          git commit -m "backport: add passthru channel change and WMA/MLME control"
          git push origin HEAD:main
